<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">

<!-- Theme vor dem ersten Zeichnen setzen, damit nichts flackert -->
<script>(function(){var d=document.documentElement,t;d.className+=' js';try{t=localStorage.getItem('firstlicht-theme')}catch(e){}if(t!=='hell'&&t!=='dunkel')t=matchMedia('(prefers-color-scheme: dark)').matches?'dunkel':'hell';d.setAttribute('data-theme',t)})();</script>
